org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Public URL of the repository that holds QVoice's complete source code.
#
# REQUIRED for every release build. QVoice ships espeak-ng (GPL-3.0) inside
# the sherpa-onnx native library, so every copy we distribute must come with
# an offer of the complete corresponding source (GPL-3.0 section 6). The
# About screen shows this URL, and app/build.gradle.kts refuses to run a
# release task while it is empty. Before uploading a build to Play, push the
# exact source of that build here (store/RELEASE.md, step 1).
qvoice.sourceUrl=https://github.com/cyber-cyper/qvoice
