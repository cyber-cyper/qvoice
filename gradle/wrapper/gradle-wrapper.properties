# Read by Android Studio (and by gradlew, if you ever add it). Without this
# file Android Studio creates one with its own default Gradle (9.3.0), which
# AGP 9.2.1 rejects ("Minimum supported Gradle version is 9.4.1").
# The command-line builds use the standalone Gradle 9.4.1 and ignore it.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
